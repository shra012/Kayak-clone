  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      cache_from:
        - node:20-alpine
    container_name: kayak-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      AI_AGENT_URL: ${AI_AGENT_URL:-http://ai-agent:8000}
      JWT_SECRET: ${JWT_SECRET:-b43f4a193e86813cc7aa32ce4f83b447840b8c3f5a1dade416134d40ac4f3e6fd008783af612878efbd1ebdc0844a56171bdbd46efd4721f9fc4036c3320593c}
      SESSION_SECRET: ${SESSION_SECRET:-ea087358888b1bcd38b05b73d545878c532cb9615617dd896863fc7088620cb056ba0c1f0b9276e2c871e60ddca1c27f7bde5e88427587bd756f293c47b0a376}
    volumes:
      - ./backend/kafka:/app/kafka:ro
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      cache_from:
        - node:20-alpine
    container_name: kayak-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
      cache_from:
        - python:3.12-slim
    container_name: kayak-ai-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./ai-agent/.env
    environment:
      PORT: 8000
      DATABASE_URL: ${SUPABASE_DATABASE_URL:-${DATABASE_URL:-}}
      REDIS_URL: ${REDIS_URL:-${AI_AGENT_REDIS_URL:-}}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

